<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>truex Loading · v1 Mark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,400..500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Loading v1 · Mark: the quietest option. Brand mark breathes, sparkle traces itself,
   one thin progress bar and a single mono status line that steps through boot phases.
   Tokens copied from login-google-v1.html (truex design spec). */
:root {
  --bg: #FFFFFF; --surface: #FFFFFF; --surface-3: #F6F9FA;
  --line: #E3ECEF; --line-strong: #D8E0E4;
  --ink: #1F2A30; --ink-2: #5F6D73; --ink-3: #849198;
  --accent: #3691CD; --accent-2: #2A7DB4; --accent-soft: #EAF5F8; --accent-soft-2: #BCDEE8; --accent-fg: #2A72A3;
  --glow-1: rgb(188 222 232 / 60%); --glow-2: rgb(234 245 248 / 90%);
  --board-dot: rgb(31 42 48 / 11%);
  --shadow-md: 0 1px 2px rgb(31 42 48 / 4%), 0 8px 24px -8px rgb(31 42 48 / 10%);
  --font-sans: "Figtree", ui-sans-serif, system-ui, sans-serif;
  --font-accent: "Newsreader", ui-serif, Georgia, serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #171717; --surface: #171717; --surface-3: #242424;
  --line: #2A2A2A; --line-strong: #363636;
  --ink: #EEF4F6; --ink-2: #B7C3C8; --ink-3: #8B999F;
  --accent-2: #5AA8DC; --accent-soft: #14283A; --accent-soft-2: #1F4461; --accent-fg: #BCDEE8;
  --glow-1: rgb(54 145 205 / 16%); --glow-2: rgb(188 222 232 / 6%);
  --board-dot: rgb(238 244 246 / 9%);
  --shadow-md: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px -8px rgb(0 0 0 / 50%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; display: grid; place-items: center; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(520px 360px at 50% 46%, var(--glow-1), transparent 70%),
              radial-gradient(circle, var(--board-dot) 1px, transparent 1.2px) 0 0 / 22px 22px;
  -webkit-mask: radial-gradient(600px 460px at 50% 48%, #000 30%, transparent 80%); mask: radial-gradient(600px 460px at 50% 48%, #000 30%, transparent 80%); }

.stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; animation: rise .5s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* mark */
.mark { position: relative; width: 64px; height: 64px; border-radius: 18px; background: var(--ink); color: var(--bg); display: grid; place-items: center; box-shadow: var(--shadow-md); animation: breathe 2.4s ease-in-out infinite; }
.mark::after { content: ""; position: absolute; inset: -8px; border-radius: 24px; border: 1px solid var(--accent-soft-2); opacity: 0; animation: halo 2.4s ease-out infinite; }
.mark svg { width: 34px; height: 34px; overflow: visible; }
.mark path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: trace 2.4s cubic-bezier(.6,0,.2,1) infinite; }
@keyframes breathe { 50% { transform: scale(1.04); } }
@keyframes halo { 0% { opacity: .9; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.18); } }
@keyframes trace { 0% { stroke-dashoffset: 60; fill-opacity: 0; } 45% { stroke-dashoffset: 0; fill-opacity: 0; } 60%, 85% { stroke-dashoffset: 0; fill-opacity: 1; } 100% { stroke-dashoffset: -60; fill-opacity: 0; } }

.word { font-weight: 700; font-size: 22px; letter-spacing: -.03em; }

.progress { width: 200px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.bar { width: 100%; height: 3px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--accent); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.status { height: 18px; font: 500 11px/18px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); text-align: center; }
.status span { display: inline-block; animation: swap .35s ease-out; }
@keyframes swap { from { opacity: 0; transform: translateY(4px); } }

/* demo controls (not part of the screen) */
.demo { position: fixed; top: 14px; right: 14px; display: inline-flex; padding: 2px; border-radius: 9px; background: var(--surface-3); border: 1px solid var(--line); }
.demo button { height: 26px; padding: 0 10px; border: 0; border-radius: 7px; background: none; color: var(--ink-2); font: 12px var(--font-sans); cursor: pointer; }
.demo button:hover { color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  .mark, .mark::after, .mark path, .stage, .status span { animation: none; }
  .mark path { stroke-dashoffset: 0; fill-opacity: 1; }
}
</style>
</head>
<body>
<main class="stage" role="status" aria-live="polite" aria-busy="true">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M12 4l1.9 5.1L19 11l-5.1 1.9L12 18l-1.9-5.1L5 11l5.1-1.9z"/></svg>
  </div>
  <div class="word">truex</div>
  <div class="progress">
    <div class="bar" aria-hidden="true"><span id="bar"></span></div>
    <div class="status"><span id="status">Starting up</span></div>
  </div>
</main>

<div class="demo">
  <button type="button" id="replay">Replay</button>
  <button type="button" id="theme">Toggle theme</button>
</div>

<script>
  const STEPS = ['Starting up', 'Signing you in', 'Loading workspace', 'Waking your agents', 'Almost there'];
  const bar = document.getElementById('bar'), status = document.getElementById('status');
  let i = 0, timer;
  function step() {
    status.textContent = STEPS[i];
    status.style.animation = 'none'; status.offsetHeight; status.style.animation = '';
    bar.style.width = ((i + 1) / STEPS.length * 100) + '%';
    if (++i < STEPS.length) timer = setTimeout(step, 900);
  }
  function run() { clearTimeout(timer); i = 0; bar.style.width = '0'; setTimeout(step, 120); }
  document.getElementById('replay').onclick = run;
  document.getElementById('theme').onclick = () => {
    const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark';
  };
  if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  run();
</script>
</body>
</html>
